# Vertonung auf dem Pi, Port 8641. Vorne Caddy mit dem Zertifikat der Hausstelle (tools/ausrollen.sh
# stellt es aus), dahinter die App ohne TLS, nur im eigenen Netz erreichbar. Daten in ./daten.
services:
  vertonung:
    build: .
    image: vertonung:aktuell
    container_name: vertonung
    restart: unless-stopped
    user: "1000:1000"
    expose:
      - "8000"
    # Einstellungen, die nicht ins Repo gehören (etwa Adresse und Schlüssel der Leitstelle), stehen nur auf dem Pi
    env_file:
      - path: .env
        required: false
    environment:
      VERTONUNG_DATEN: /app/daten
      VERTONUNG_CA_DATEI: /zertifikate/rootCA.pem
    volumes:
      - ./daten:/app/daten
      # Sicherungen der Datenbank nach der Regel des Appkerns: wöchentlich von der App, vor dem Neustart vom Ausrollen
      - ./sicherungen:/app/sicherungen
      - ./zertifikate:/zertifikate:ro
      # Ortszeit des Pi (sonst UTC)
      - /etc/localtime:/etc/localtime:ro

  vorne:
    image: caddy:2.11.6-alpine
    container_name: vertonung-vorne
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on: [vertonung]
    ports:
      - "8641:8641"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./zertifikate:/zertifikate:ro
